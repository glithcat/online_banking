<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	{%load static%}
	<link rel="stylesheet" href="{% static 'myfinalapp/mycss.css' %}">
</head>
<body>
    <div class="centerdiv">
    	<div class="d-flex justify-content-center align-items-center vh-100">
			<div class="card-body">
				<div class="centerdiv" id = "login_block">
	    			<form class="form-control" method = "post" style="padding : 20vh, 10 wh" >
					{%csrf_token%}
					<input style = "" type = "text"  name = "username"> <br>
					<input type = "password"  name = "password"> <br>
					<input type = "checkbox" name = "new_account" id="new_account"> в мене нема акаунту <br>
					<div id="new_account_field" style="display: none;">
						<input type="email" name="email" placeholder="Email"> <br>
					</div>
					<button type="submit" class = "btn btn-primary mt-3">login</button>
					</form>
				</div >

			</div>
    	</div>
    </div>

</body>
<script>
	const checkbox = document.getElementById("new_account");
	const newAccountField = document.getElementById("new_account_field");

	checkbox.addEventListener("change", function() {
		newAccountField.style.display = this.checked ? 'block' : 'none';
	});

</script>
</html>
